<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments :: head('Dashboard - Personal Blog')}">
</head>

<body>

<header th:replace="~{fragments :: header}">
</header>

<main>

    <h2>Dashboard</h2>

    <a th:href="@{/articles/new}" class="add-article-button">
        Add New Article
    </a>

    <div th:if="${articles.isEmpty()}">
        <p>No articles published yet.</p>
    </div>

    <div class="article-list" th:unless="${articles.isEmpty()}">

        <div class="article-card" th:each="article : ${articles}">

            <a th:href="@{/articles/{id}(id=${article.id})}"
               th:text="${article.title}"
               class="article-title">
                Article title
            </a>

            <div class="article-actions">

                <a th:href="@{/articles/{id}/edit(id=${article.id})}"
                   class="edit-button">
                    Edit
                </a>

                <form th:action="@{/articles/{id}/delete(id=${article.id})}"
                      method="post"
                      class="delete-form">

                    <button type="submit" class="delete-button">
                        Delete
                    </button>

                </form>

            </div>

        </div>

    </div>

</main>

<footer th:replace="~{fragments :: footer}">
</footer>

</body>
</html>
